name: Update K-line Data

on:
  schedule:
    # 每 5 分钟跑一次（GitHub Actions cron 最小间隔）
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write  # 允许 push

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run data update
        env:
          JIN10_TOKEN: ${{ secrets.JIN10_TOKEN }}
        run: python3 tools/ci_update.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto update K-line data $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
